<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<title>Admin dashboard — SalonHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav id="site-nav"></nav>

<section>
  <div class="container">
    <div class="section-head">
      <div>
        <h1 style="font-size:1.8rem;">Admin dashboard</h1>
        <p class="muted">Verify providers and keep an eye on activity across SalonHub.</p>
      </div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="dash-shell">
      <nav class="dash-side">
        <a href="#" class="is-active">Platform</a>
        <a href="#" id="logout-side">Log out</a>
      </nav>

      <div>
        <div class="tabs">
          <button class="tab-btn is-active" data-tab="providers">Providers</button>
          <button class="tab-btn" data-tab="customers">Customers</button>
          <button class="tab-btn" data-tab="bookings">All bookings</button>
        </div>

        <div class="tab-panel is-active" id="tab-providers">
          <div class="filter-bar" style="margin-bottom:20px;">
            <div class="field" style="min-width:200px;">
              <label for="provider-filter">Show</label>
              <select id="provider-filter">
                <option value="all">All providers</option>
                <option value="pending">Pending review</option>
                <option value="verified">Verified</option>
              </select>
            </div>
          </div>
          <div class="table-wrap" id="providers-wrap"></div>
        </div>

        <div class="tab-panel" id="tab-customers">
          <div class="table-wrap" id="customers-wrap"></div>
        </div>

        <div class="tab-panel" id="tab-bookings">
          <div class="table-wrap" id="bookings-wrap"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <span>&copy; <span id="year"></span> SalonHub — demo project</span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard-admin.js"></script>
</body>
</html>
