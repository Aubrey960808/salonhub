<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<title>Set a new password — SalonHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav id="site-nav"></nav>

<section>
  <div class="container-narrow">
    <h1 class="center" style="font-size:2rem;">Choose a new password</h1>

    <div class="form-card">
      <div class="form-error" id="form-error"></div>
      <div id="invalid-link" style="display:none;">
        <p class="muted">This reset link is invalid or has expired.</p>
        <a href="forgot-password.html" class="btn">Request a new link</a>
      </div>

      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" type="password" required minlength="6" />
        </div>
        <button class="btn btn-block" type="submit">Update password</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <span>&copy; <span id="year"></span> SalonHub — demo project</span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
